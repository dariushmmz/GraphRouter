data_dir: 'data/GSM8K'
query_response_length: 512

# Config parameters for graph_router training:
scenario: "Cost First" # "Balance" #"Performance First" # "Cost First"
semantic_embeddings: True
feedback: True

seed: 1881
# model_path: 'model_path/model.pth' # +semantic_embeddings / +feedback
llm_num: 10
learning_rate: 0.0003
weight_decay: 0.0001
train_mask_rate: 0.5
batch_size: 32
num_task: 4
split_ratio: [0.7, 0.1, 0.2]
embedding_dim: 8
edge_dim: 4
